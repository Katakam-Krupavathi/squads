version: 1

applications:
  - appRoot: frontend

    env:
      variables:
        VITE_USE_MOCK_API: "true"

    frontend:
      phases:
        preBuild:
          commands:
            - npm ci

        build:
          commands:
            - npm test
            - npm run build

      artifacts:
        baseDirectory: dist
        files:
          - '**/*'

      cache:
        paths:
          - node_modules/**/*
